apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-health-lab
spec:
  replicas: 2
  selector:
    matchLabels: {app: kubernetes-health-lab}
  template:
    metadata:
      labels: {app: kubernetes-health-lab}
    spec:
      containers:
        - name: api
          image: kubernetes-health-lab:local
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /live, port: 8080}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "300m", memory: "128Mi"}
